services:
  postgres:
    image: postgres:16
    container_name: room-booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: room_booking
      POSTGRES_USER: room_booking_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - room_booking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U room_booking_user -d room_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  room_booking_data:
